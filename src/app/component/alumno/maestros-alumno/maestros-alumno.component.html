<div class="row mt-4">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Lista de evaluaciones</h4>
        <hr />
        <div class="table-responsive">
          <table class="table align-middle text-nowrap">
            <thead>
              <tr>
                <th class="text-center">#</th>
                <th>Maestro</th>
                <th>Materia</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let maestro of maestros; let i = index">
                <td class="text-center">{{ i + 1 }}</td>
                <td>{{ maestro.nombreMaestro }}</td>
                <td>{{ maestro.materia }}</td>
                <td class="text-center">
                  <div class="d-flex align-items-center justify-content-between gap-2">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      [checked]="maestro.respuestasCompletadas"
                      disabled
                    />
                    <button
                    pButton
                    label="Entrar"
                    class="p-button-rounded p-button-success"
                    [routerLink]="['/preguntas', maestro.nombreMaestro, maestro.grupo, maestro.materia]"
                    [disabled]="maestro.respuestasCompletadas"
                  ></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<p-toast></p-toast>

<aside class="saed-sidebar">

  <!-- ── Logo ──────────────────────────────────────────────────── -->
  <div class="sidebar-logo">
    <img src="assets/images/logos/logo.png" alt="UTS" class="logo-img" />
    <span class="logo-version">v1.0.0</span>
  </div>

  <div class="sidebar-divider"></div>

  <!-- ── Navegación ────────────────────────────────────────────── -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li
        class="nav-item"
        *ngFor="let item of sidebarnavItems"
        [class.has-submenu]="item.submenu.length > 0"
        [class.open]="showMenu === item.title">

        <!-- Ítem sin submenu -->
        <a
          *ngIf="item.submenu.length === 0"
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }">
          <i [class]="item.icon + ' nav-icon'"></i>
          <span class="nav-label">{{ item.title }}</span>
        </a>

        <!-- Ítem con submenu -->
        <a
          *ngIf="item.submenu.length > 0"
          class="nav-link nav-link-parent"
          [class.open]="showMenu === item.title"
          (click)="toggleSubmenu(item.title)">
          <i [class]="item.icon + ' nav-icon'"></i>
          <span class="nav-label">{{ item.title }}</span>
          <i class="bi bi-chevron-down chevron" [class.rotated]="showMenu === item.title"></i>
        </a>

        <!-- Submenu -->
        <ul class="submenu-list" *ngIf="item.submenu.length > 0 && showMenu === item.title">
          <li *ngFor="let sub of item.submenu">
            <a
              class="submenu-link"
              [routerLink]="sub.path"
              routerLinkActive="active">
              <i [class]="sub.icon + ' sub-icon'"></i>
              <span>{{ sub.title }}</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- ── Footer sidebar ────────────────────────────────────────── -->
  <div class="sidebar-footer">
    <div class="sidebar-divider"></div>
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>

</aside>
